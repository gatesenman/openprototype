name: Desktop Release (cross-platform installers)

# Builds native OpenPrototype desktop installers for macOS (.app/.dmg),
# Windows (.exe/.msi) and Linux (AppImage/.deb/.rpm) via a Tauri build matrix.
# Trigger by pushing a tag like `v0.1.0`, or run manually from the Actions tab.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS universal (Apple Silicon + Intel) -> .app / .dmg
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          # Windows -> .exe (NSIS) / .msi (WiX)
          - platform: windows-latest
            args: ""
          # Linux -> AppImage / .deb / .rpm
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            build-essential \
            file

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo (src-tauri)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenPrototype ${{ github.ref_name }}"
          releaseBody: "Native desktop installers for macOS, Windows and Linux."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
