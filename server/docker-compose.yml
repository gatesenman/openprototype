services:
  db:
    image: postgres:16-alpine
    container_name: op-postgres
    environment:
      POSTGRES_USER: openprototype
      POSTGRES_PASSWORD: openprototype
      POSTGRES_DB: openprototype
    ports:
      - "5433:5432"
    volumes:
      - op_pgdata:/var/lib/postgresql/data

volumes:
  op_pgdata:
